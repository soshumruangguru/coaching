// ── PG ──────────────────────────────────────────────────
function buildPGOpts(q,isAns){
  var labs=['A','B','C','D','E'];
  var h='<div class="opts">';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(isAns){
      if(i===q.answer)cls+=' revealed-correct';
      else cls+=' revealed-wrong';
    }
    var dis=isAns?'disabled':'';
    h+='<button class="'+cls+'" '+dis+' onclick="pickPG('+q.no+','+i+')">';
    h+='<span class="olbl">'+labs[i]+'</span><span>'+q.opts[i]+'</span></button>';
  }
  return h+'</div>';
}

function pickPG(qno,idx){
  answered[qno]=true;
  var q=Q.find(function(x){return x.no===qno;});
  var btns=document.querySelectorAll('#qcard .opt');
  btns.forEach(function(b,i){
    b.disabled=true;
    b.classList.remove('revealed-correct','revealed-wrong');
    if(i===q.answer)b.classList.add('revealed-correct');
    else b.classList.add('revealed-wrong');
  });
  openExpl(qno);
}

// ── MCMA ────────────────────────────────────────────────
function buildMCMAOpts(q,isAns){
  var sel=mcSel[q.no]||[];
  var h='<div class="mc-opts">';
  for(var i=0;i<q.opts.length;i++){
    var isSel=sel.indexOf(i)>=0;
    var isCorrect=q.answers.indexOf(i)>=0;
    var cls='mc-opt';
    if(isAns){
      if(isSel&&isCorrect)cls+=' r-correct';
      else if(isSel&&!isCorrect)cls+=' r-wrong';
      else if(!isSel&&isCorrect)cls+=' r-missed';
    } else {
      if(isSel)cls+=' sel';
    }
    var dis=isAns?'disabled':'';
    h+='<button class="'+cls+'" '+dis+' onclick="toggleMC('+q.no+','+i+')">';
    h+='<span class="mc-chk">&#10003;</span><span>'+q.opts[i]+'</span></button>';
  }
  h+='</div>';
  if(!isAns){
    h+='<button class="mc-submit" id="mc-submit-'+q.no+'" onclick="submitMC('+q.no+')">Lihat Pembahasan</button>';
  }
  return h;
}

function toggleMC(qno,idx){
  if(!mcSel[qno])mcSel[qno]=[];
  var a=mcSel[qno],ni=a.indexOf(idx);
  if(ni>=0)a.splice(ni,1);else a.push(idx);
  var q=Q.find(function(x){return x.no===qno;});
  var btns=document.querySelectorAll('#qcard .mc-opt');
  btns.forEach(function(b,i){
    b.classList.remove('sel');
    if(a.indexOf(i)>=0)b.classList.add('sel');
  });
}

function submitMC(qno){
  answered[qno]=true;
  var q=Q.find(function(x){return x.no===qno;});
  var sel=mcSel[qno]||[];
  var btns=document.querySelectorAll('#qcard .mc-opt');
  btns.forEach(function(b,i){
    b.disabled=true;
    b.classList.remove('sel','r-correct','r-wrong','r-missed');
    var isSel=sel.indexOf(i)>=0,isCorrect=q.answers.indexOf(i)>=0;
    if(isSel&&isCorrect)b.classList.add('r-correct');
    else if(isSel&&!isCorrect)b.classList.add('r-wrong');
    else if(!isSel&&isCorrect)b.classList.add('r-missed');
  });
  var sb=document.getElementById('mc-submit-'+qno);
  if(sb)sb.style.display='none';
  openExpl(qno);
}

// ── PGK ─────────────────────────────────────────────────
function buildPGKOpts(q,isAns){
  var sel=pgkSel[q.no]||[];
  var h='<div class="pgk-wrap">';
  h+='<div class="pgk-head"><span>Pernyataan</span><span style="text-align:center">Benar</span><span style="text-align:center">Salah</span></div>';
  for(var i=0;i<q.stmts.length;i++){
    var uv=sel[i]; // null | 1 (benar) | 0 (salah)
    var cv=q.answers[i]?1:0; // canonical: 1=benar, 0=salah
    var rowCls='pgk-row';
    if(isAns)rowCls+=(uv===cv)?' r-ok':' r-bad';
    var btCls='pgk-btn',bfCls='pgk-btn';
    if(isAns){
      // Benar button: hijau jika jawaban benar=Benar, merah jika user pilih Benar tapi salah
      btCls='pgk-btn '+(cv===1?'r-ok':(uv===1?'r-bad':''));
      bfCls='pgk-btn '+(cv===0?'r-ok':(uv===0?'r-bad':''));
    } else {
      if(uv===1)btCls='pgk-btn sel-t';
      if(uv===0)bfCls='pgk-btn sel-f';
    }
    var dis=isAns?'disabled':'';
    h+='<div class="'+rowCls+'" id="pgkrow-'+q.no+'-'+i+'">';
    h+='<div class="pgk-stmt">'+q.stmts[i]+'</div>';
    h+='<div class="pgk-col"><button class="'+btCls+'" '+dis+' id="pgkbt-'+q.no+'-'+i+'" onclick="pickPGK('+q.no+','+i+',1)">Benar</button></div>';
    h+='<div class="pgk-col"><button class="'+bfCls+'" '+dis+' id="pgkbf-'+q.no+'-'+i+'" onclick="pickPGK('+q.no+','+i+',0)">Salah</button></div>';
    h+='</div>';
  }
  h+='</div>';
  if(!isAns){
    h+='<button class="mc-submit" style="border-color:var(--pk);background:var(--pk)" id="pgk-submit-'+q.no+'" onclick="submitPGK('+q.no+')">Lihat Pembahasan</button>';
  }
  return h;
}

function pickPGK(qno,idx,val){
  // val: 1=Benar, 0=Salah
  if(answered[qno])return;
  if(!pgkSel[qno]){
    var qq=Q.find(function(x){return x.no===qno;});
    pgkSel[qno]=[];
    for(var i=0;i<qq.stmts.length;i++)pgkSel[qno].push(null);
  }
  // Toggle: clicking same value deselects
  pgkSel[qno][idx]=(pgkSel[qno][idx]===val)?null:val;
  var qq=Q.find(function(x){return x.no===qno;});
  for(var i=0;i<qq.stmts.length;i++){
    var uv=pgkSel[qno][i];
    var bt=document.getElementById('pgkbt-'+qno+'-'+i);
    var bf=document.getElementById('pgkbf-'+qno+'-'+i);
    if(!bt||!bf)continue;
    bt.className='pgk-btn'+(uv===1?' sel-t':'');
    bf.className='pgk-btn'+(uv===0?' sel-f':'');
  }
}

function submitPGK(qno){
  answered[qno]=true;
  var q=Q.find(function(x){return x.no===qno;});
  var sel=pgkSel[qno]||[];
  for(var i=0;i<q.stmts.length;i++){
    var uv=sel[i]; // 1|0|null
    var cv=q.answers[i]?1:0;
    var row=document.getElementById('pgkrow-'+qno+'-'+i);
    var bt=document.getElementById('pgkbt-'+qno+'-'+i);
    var bf=document.getElementById('pgkbf-'+qno+'-'+i);
    if(!row||!bt||!bf)continue;
    row.className='pgk-row '+(uv===cv?'r-ok':'r-bad');
    bt.disabled=true; bf.disabled=true;
    bt.className='pgk-btn '+(cv===1?'r-ok':(uv===1?'r-bad':''));
    bf.className='pgk-btn '+(cv===0?'r-ok':(uv===0?'r-bad':''));
  }
  var sb=document.getElementById('pgk-submit-'+qno);
  if(sb)sb.style.display='none';
  openExpl(qno);
}

function openExpl(qno){
  var ew=document.getElementById('expl-'+qno);
  if(!ew)return;
  ew.classList.add('open');
  setTimeout(function(){ew.scrollIntoView({behavior:'smooth',block:'nearest'});},200);
}

// ── INIT ────────────────────────────────────────────────
buildWelcome();
showPage('pg-welcome');
</script>
